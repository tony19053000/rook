[project]
name = "rook-cli"
version = "0.1.0"
description = "Finds the smallest sequence of actions that breaks a business rule, proves it by execution, and verifies fixes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "typer",
    "textual",
    "rich",
    "pyyaml",
    "pyjwt",
]

[project.scripts]
rook = "rook.cli.main:app"
rook-pr-comment = "rook.github.pr_comment:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not docker and not bob"'
markers = [
    "docker: needs a running Docker daemon",
    "bob: makes live IBM Bob calls (costs Bobcoins; run manually)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
