# The sandbox allowlist of the hosted image (03 §3, sandbox/allowlist.py): the ONLY repos the server runs.
# ROOK_ALLOWLIST points here. app_dir is where the Dockerfile installed the app.
#
# rook-demo/minishop is the interim demo: the tests/fixtures/minishop app, with its Bob recordings baked in for
# replay mode. Its "commit" is a fixed pseudo-SHA (sha1 of "rook-demo-minishop"): it is not a git repo.
entries:
  - repo: rook-demo/minishop
    commit: '406059b53767b10f157b4eb92105d10af6a0c44d'
    app_dir: /opt/rook/demos/minishop
    start: ['{python}', '-m', 'uvicorn', 'app:app', '--host', '127.0.0.1', '--port', '{port}']
    # The native test command (key `test`). It runs only in replay mode, from the run's workspace copy, with
    # the regression test's path appended (sandbox/process.py). pytest comes from the image's `sandbox` group.
    commands:
      test: ['{python}', '-m', 'pytest', '-q', '-p', 'no:cacheprovider', '-o', 'asyncio_mode=auto']
    command_timeout: 300

