# The hosted server (02 §14): rook (FastAPI, not published) behind Caddy (HTTPS on 80/443).
#   cd deploy && sudo docker compose up -d --build
# Non-secret settings come from deploy/.env (written by deploy/aws/deploy.sh; compose reads it for ${...}).
# Secrets come ONLY from the root-only host file ROOK_ENV_FILE (default /etc/rook/rook.env, chmod 600, written by
# deploy/aws/scripts/set-secret.sh), never from the image or the repo. Settings in `environment:` win over it.
name: rook

services:
  rook:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rook-server:local
    restart: unless-stopped
    env_file:
      - ${ROOK_ENV_FILE:-/etc/rook/rook.env}
    environment:
      ROOK_BOB_MODE: ${ROOK_BOB_MODE:-replay}
      # Only for CORS (local dev, direct calls); the web itself calls same-origin through the Vercel rewrite.
      ROOK_WEB_ORIGINS: ${ROOK_WEB_ORIGINS:-http://localhost:3000}
      # browser -> Vercel -> Caddy -> rook: Vercel sets X-Forwarded-For to the client IP (it overwrites any
      # client-sent value) and Caddy appends Vercel's IP, so the client is 2 entries from the right. With
      # ROOK_PROXY_SECRET in the env file, the Vercel entry is trusted only on requests that carry the secret header
      # (03 §8); the rest are counted by the address Caddy saw.
      ROOK_TRUSTED_PROXY_HOPS: "2"
      ROOK_DAILY_COIN_CAP: ${ROOK_DAILY_COIN_CAP:-2}
      # The OAuth callback of `rook login` (03 §6): https://<ROOK_HOST>/api/v1/auth/cli/callback
      ROOK_PUBLIC_URL: https://${ROOK_HOST:?set ROOK_HOST, e.g. 203-0-113-7.sslip.io}
      ROOK_DB_PATH: /data/rook.db
      ROOK_WORKSPACES: /data/workspaces
    volumes:
      - rook-data:/data
    expose:
      - "8000" # no `ports:`: reachable only from Caddy on the compose network
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1400m

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on: [rook]
    ports:
      - "${ROOK_HTTP_PORT:-80}:80"
      - "${ROOK_HTTPS_PORT:-443}:443"
    environment:
      ROOK_HOST: ${ROOK_HOST:?set ROOK_HOST, e.g. 203-0-113-7.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rook-data:
  caddy-data:
  caddy-config:
